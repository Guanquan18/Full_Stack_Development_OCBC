<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Local Recipient</title>
    <link rel="stylesheet" href="transaction.css">
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="window.location.href='transaction.html';">Back</button> 
        <header>
            <h1>Balance</h1>
        </header>
        <div class="form-group">
            <input type="text" id="recipient-name" placeholder="Enter recipient's name">
        </div>
        <div class="form-group">
            <select id="bank">
                <option value="" disabled selected>Select bank</option> 
                <option value="DBS">DBS</option>
                <option value="POSB">POSB</option>
                <option value="OCBC">OCBC</option>
                <option value="UOB">UOB</option>
            </select>
        </div>
        <div class="form-group">
            <input type="text" id="account-number" placeholder="Enter account number">
        </div>
        <button class="Next">NEXT</button>
    </div>
</body>
</html>
