<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Review Details</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #3f4347;
        }
        .app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .back-button {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-size: 24px;
            font-weight: 600;
            padding-top: 5px;
            align-self: flex-start; /* Aligns to the left */
        }

        .back-button img {
            height: 30px;
            margin-right: 5px;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .details-section {
            width: 90%;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            background: rgb(241,233,244);
            background: linear-gradient(45deg, rgb(247, 239, 250) 0%, rgba(252,251,249,1) 100%);
        }
        .detail {
            margin-bottom: 15px;
        }
        .label {
            color: #6d6f72;
            font-weight: 500;
            display: block;
            font-size: 16px;
            padding-bottom: 5px;
        }
        .value {
            font-size: 16px;
            font-weight: bold;
        }
        .add-button {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #f03c3c;
            border: none;
            border-radius: 10px;
            padding: 15px 60px;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }
        @media (max-width: 430px) {
            .app {
                max-width: 100%;
                height: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <a href="javascript:void(0);" class="back-button" onclick="goBack()">
            <img src="../images/back-icon.png" alt="Back">
        </a>
        <div class="header">Review Details</div>
        <div class="details-section">
            <div class="detail">
                <span class="label">Recipient’s Name</span>
                <span class="value" id="recipientName">Andy</span>
            </div>
            <div class="detail">
                <span class="label">Country</span>
                <span class="value" id="country">Singapore</span>
            </div>
            <div class="detail">
                <span class="label">Recipient’s Bank</span>
                <span class="value" id="bankName">DBS</span>
            </div>
            <div class="detail">
                <span class="label">Recipient’s Account No.</span>
                <span class="value" id="accountNumber">29373857459</span>
            </div>
        </div>
        <button class="add-button" onclick="addRecipient()">ADD RECIPIENT NOW </button>
    </div>

    <script>
        function goBack() {
            window.location.href = "addRecipient.html";
        }

        // Load recipient data from sessionStorage and display it on the page
        document.addEventListener("DOMContentLoaded", function() {
            const recipientData = JSON.parse(sessionStorage.getItem("recipientData"));
            if (recipientData) {
                document.getElementById("recipientName").textContent = recipientData.recipientName;
                document.getElementById("bankName").textContent = recipientData.bankName;
                document.getElementById("accountNumber").textContent = recipientData.accNum;
            }
        });

        async function addRecipient() {
            const profileId = JSON.parse(sessionStorage.getItem("profileId"));
            const recipientData = JSON.parse(sessionStorage.getItem("recipientData"));

            try {
                const response = await fetch("/recipients", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${sessionStorage.getItem("token")}`
                    },
                    body: JSON.stringify({
                        profileId: profileId,
                        recipientName: recipientData.recipientName,
                        bankName: recipientData.bankName,
                        accNum: recipientData.accNum
                    })
                });

                if (response.ok) {
                    const successData = await response.json();
                    console.log("Recipient added successfully:", successData);
                    const recipientCurrencyCode = successData.CurrencyCode;
                    const senderCurrencyCode = sessionStorage.getItem("AccCurrency");
                    if (recipientCurrencyCode === senderCurrencyCode) {
                        alert("Recipient added successfully.");
                        window.location.href = "transaction.html";
                    } else {
                        alert("Recipient added successfully.");
                        sessionStorage.setItem("recipientCurrencyCode", successData.recipient.CurrencyCode);
                        window.location.href = "overseas.html";
                    }
                } else {
                    const errorData = await response.json();
                // Show the error message if there is an error
                if (errorData.error) {
                    if (errorData.error === "Recipient already exists with this profile and account number.") {
                        alert("Recipient already exists with this profile and account number.");
                    } else if (errorData.error === "The specified account number does not exist.") {
                        alert("The specified account number does not exist.");
                    }
                    window.location.href = "addRecipient.html";
                }
                }
            } catch (error) {
                console.error("Error adding recipient:", error);
                alert("An error occurred while adding the recipient.");
            }
        }
    </script>
</body>
</html>
