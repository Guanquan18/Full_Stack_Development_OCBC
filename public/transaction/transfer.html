<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }
        .back-button {
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: left;
            padding: 0;
        }
        .balance-section {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 18px;
            color: #000;
        }
        .amount-details-section {
            background-color: black;
            color: white;
            border-radius: 10px;
            overflow: hidden;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        .amount-section, .details-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            font-size: 18px;
        }

        .amount-section {
            border-bottom: 2px solid #eee; 
        }

        .amount-label {
            font-size: 18px;
            font-weight: 600;
            color: white;
        }

        .details-section {
            background-color: #ffd7d7;;
            color: #666;
            font-size: 16px;
        }

        .input-amount {
            font-size: 18px;
            padding: 8px;
            width: 100px;
            text-align: right;
            color: #333;
            background-color: #f4f4f4; 
            border: 1px solid #ddd; 
            border-radius: 5px;
        }

        .next-button {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 8px;
            padding: 15px 60px;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            align-self: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 430px) {
            .app {
                max-width: 100%;
                height: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <button class="back-button" onclick="goBack()">Back</button>
        <div class="balance-section">
            Balance<br>
            <span class="balance-amount" id="balance">$0.00</span>
        </div>

        <div class="amount-details-section">
            <div class="amount-section">
                <span class="amount-label">Amount</span>
                <span>SGD</span>
                <input type="number" id="transferAmount" class="input-amount" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="details-section">
                <span>To:</span>
                <span id="recipientName"></span> <!-- Added ID for recipient name -->
            </div>
            <div class="details-section">
                <span>Recipient No: </span>
                <span id="accountNumber"></span> <!-- Added ID for account number -->
            </div>
            <div class="details-section">
                <span>When</span>
                <span>Immediate</span>
            </div>
        </div>
        

        <button class="next-button" onclick="handleNext()">NEXT</button>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        async function handleNext() {
            const transferAmount = parseFloat(document.getElementById("transferAmount").value);
            const balance = parseFloat(document.getElementById("balance").textContent.replace("$", ""));

            if (isNaN(transferAmount) || transferAmount <= 0) {
                alert("Please enter a valid transfer amount.");
                return;
            }

            if (transferAmount > balance) {
                alert("Transfer amount exceeds available balance.");
                return;
            }

            // Save transfer amount in sessionStorage for use in transfer-details.html
            sessionStorage.setItem("transferAmount", transferAmount);

            // Redirect to transfer-details.html
            window.location.href = "transfer-details.html";
        }

        document.addEventListener("DOMContentLoaded", async function() {
            const profileId = JSON.parse(sessionStorage.getItem("profileId"));
            try {
                const response = await fetch(`/account/${profileId}`);
                if (response.ok) {
                    const accountData = await response.json();
                    document.getElementById("balance").textContent = `$${accountData.Balance.toFixed(2)}`;
                } else {
                    console.error("Failed to fetch balance.");
                }
            } catch (error) {
                console.error("Error fetching balance:", error);
            }
              // Retrieve recipient data from sessionStorage
            const recipientData = JSON.parse(sessionStorage.getItem("recipientData"));
            if (recipientData) {
                // Set recipient name and account number in the HTML
                document.getElementById("recipientName").textContent = recipientData.recipientName;
                document.getElementById("accountNumber").textContent = recipientData.accNum;
            } else {
                console.error("No recipient data found in sessionStorage.");
            }
        });
    </script>
</body>
</html>
