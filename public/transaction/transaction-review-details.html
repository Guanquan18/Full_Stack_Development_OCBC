<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Review Details</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .back-button {
            align-self: flex-start;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .details-section {
            width: 90%;
            background-color: #ffd7d7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .detail {
            margin-bottom: 10px;
            font-size: 14px;
        }
        .label {
            font-weight: bold;
            color: #555;
            display: block;
            font-size: 14px;
        }
        .value {
            color: #000;
            font-size: 16px;
            font-weight: bold;
        }
        .add-button {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 25px;
            padding: 15px 60px;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            box-shadow: 0px 5px 5px rgba(0, 0, 0, 0.25);
        }
        @media (max-width: 430px) {
            .app {
                max-width: 100%;
                height: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <button class="back-button" onclick="goBack()">Back</button>
        <div class="header">Review Details</div>
        <div class="details-section">
            <div class="detail">
                <span class="label">Recipient’s Name</span>
                <span class="value" id="recipientName">Andy</span>
            </div>
            <div class="detail">
                <span class="label">Country</span>
                <span class="value" id="country">Singapore</span>
            </div>
            <div class="detail">
                <span class="label">Recipient’s Bank</span>
                <span class="value" id="bankName">DBS</span>
            </div>
            <div class="detail">
                <span class="label">Recipient’s Account No.</span>
                <span class="value" id="accountNumber">29373857459</span>
            </div>
        </div>
        <button class="add-button" onclick="addRecipient()">ADD RECIPIENT NOW </button>
    </div>

    <script>
        function goBack() {
            window.location.href = "bank.html";
        }

        // Load recipient data from sessionStorage and display it on the page
        document.addEventListener("DOMContentLoaded", function() {
            const recipientData = JSON.parse(sessionStorage.getItem("recipientData"));
            if (recipientData) {
                document.getElementById("recipientName").textContent = recipientData.recipientName;
                document.getElementById("bankName").textContent = recipientData.bankName;
                document.getElementById("accountNumber").textContent = recipientData.accNum;
            }
        });

        async function addRecipient() {
            const profileId = JSON.parse(sessionStorage.getItem("profileId"));
            const recipientData = JSON.parse(sessionStorage.getItem("recipientData"));

            try {
                const response = await fetch("/recipients", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        profileId: profileId,
                        recipientName: recipientData.recipientName,
                        bankName: recipientData.bankName,
                        accNum: recipientData.accNum
                    })
                });

                if (response.ok) {
                    alert("Recipient added successfully!");
                    // Redirect to transfer.html
                    window.location.href = "transfer.html";
                } else {
                    const errorData = await response.json();
                // Show the error message if there is an error
                if (errorData.error) {
                    if (errorData.error === "Recipient already exists with this profile and account number.") {
                        alert("Recipient already exists with this profile and account number.");
                    } else if (errorData.error === "The specified account number does not exist.") {
                        alert("The specified account number does not exist.");
                    }
                    window.location.href = "bank.html";
                }
                }
            } catch (error) {
                console.error("Error adding recipient:", error);
                alert("An error occurred while adding the recipient.");
            }
        }
    </script>
</body>
</html>
