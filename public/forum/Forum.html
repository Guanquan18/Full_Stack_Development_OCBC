<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            height: 100vh;
            margin: 0;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .back-button {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }

        .back-button img {
            height: 30px;
            margin-right: 5px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #C8102E; /* OCBC Red */
            font-weight: bold;
            margin: 0 auto;
            text-align: center;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
        }

        .message .sender {
            font-weight: bold;
        }

        .message .timestamp {
            color: #777;
            font-size: 12px;
        }

        .message .text {
            margin-top: 5px;
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #e9e9e9;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        .input-container button {
            background-color: #404040;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
    <script>
        // Helper function to get URL query parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Function to fetch and display forum data
        async function loadForumData() {
            const categoryId = getQueryParam('categoryId'); // Get the category ID from the URL
            if (!categoryId) {
                alert("No category ID found!");
                return;
            }

            try {
                // Fetch category title
                const categoryResponse = await fetch('/api/forum/categories'); // Corrected URL format
                const categories = await categoryResponse.json();
                const category = categories.find(cat => cat.CategoryID == categoryId);
                if (category) {
                    document.querySelector('.header h1').textContent = category.CategoryName;
                }

                // Fetch messages for the category
                const messagesResponse = await fetch(`/api/forum/messages/${categoryId}`); // Corrected URL format
                const messages = await messagesResponse.json();

                // Display messages
                const messagesContainer = document.querySelector('.messages');
                messagesContainer.innerHTML = ''; // Clear any existing content
                messages.forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add('message');
                    messageDiv.innerHTML = `
                        <div class="sender">${msg.SenderName}</div>
                        <div class="timestamp">${msg.PostedTime}</div>
                        <div class="text">${msg.MessageContent}</div>
                    `;
                    messagesContainer.appendChild(messageDiv);
                });
            } catch (error) {
                console.error("Error loading forum data:", error);
                alert("Failed to load forum data.");
            }
        }

        // Function to post a new message
        async function postMessage() {
            const categoryId = getQueryParam('categoryId');
            const messageInput = document.querySelector('.input-container input');
            const messageContent = messageInput.value;

            if (!messageContent.trim()) {
                alert("Message cannot be empty!");
                return;
            }

            try {
                await fetch('/api/forum/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        categoryId: parseInt(categoryId),
                        senderName: 'Ben Johnson', // Replace with dynamically fetched logged-in user name
                        messageContent,
                    }),
                });

                messageInput.value = ''; // Clear input field
                loadForumData(); // Reload messages
            } catch (error) {
                console.error("Error posting message:", error);
                alert("Failed to post message.");
            }
        }

        // Initialize forum data on page load
        window.onload = loadForumData;
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../forum/ForumCategory.html" class="back-button">
                <img src="../images/back-icon.png" alt="Back">
            </a>
            <h1>Forum Title</h1>
        </div>
        <div class="messages"></div>
        <div class="input-container">
            <input type="text" placeholder="Type your input...">
            <button onclick="postMessage()">&#8593;</button>
        </div>
    </div>
</body>
</html>
