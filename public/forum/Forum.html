<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            height: 100vh;
            margin: 0;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .back-button {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }

        .back-button img {
            height: 30px;
            margin-right: 5px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #C8102E; /* OCBC Red */
            font-weight: bold;
            margin: 0 auto;
            text-align: center;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
        }

        .message .sender {
            font-weight: bold;
            display: inline-block;
        }

        .message .timestamp {
            color: #777;
            font-size: 12px;
            display: inline-block;
            margin-left: 10px;
        }

        .reply-btn {
            color: red;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            text-decoration: none;
        }

        .reply-btn:hover {
            text-decoration: underline;
        }

        .message .text {
            margin-top: 5px;
            line-height: 1.4;
        }

        .delete-btn {
            color: red;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            background: none;
            border: none;
            text-decoration: none;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #e9e9e9;
            position: relative;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        .input-container button {
            background-color: #404040;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            cursor: pointer;
        }

        .reply-highlight {
            position: absolute;
            left: 10px;
            top: -20px;
            font-size: 14px;
            font-weight: bold;
            color: black;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 15px;
            display: none;
        }
    </style>
    <script>
        // Helper function to get URL query parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Function to fetch and display forum data
        async function loadForumData() {
            const categoryId = getQueryParam('categoryId'); // Get the category ID from the URL
            if (!categoryId) {
                alert("No category ID found!");
                return;
            }

            try {
                // Fetch category title
                const categoryResponse = await fetch('/api/forum/categories');
                const categories = await categoryResponse.json();
                const category = categories.find(cat => cat.CategoryID == categoryId);
                if (category) {
                    document.querySelector('.header h1').textContent = category.CategoryName;
                }

                // Fetch messages for the category
                const messagesResponse = await fetch(`/api/forum/messages/${categoryId}`);
                const messages = await messagesResponse.json();

                // Hardcoded user for demo purposes
                const currentUser = 'Ben Johnson';

                // Display messages
                const messagesContainer = document.querySelector('.messages');
                messagesContainer.innerHTML = ''; // Clear any existing content
                messages.forEach(msg => {
                    if (!msg.MessageID) {
                        console.error("Missing MessageID for message:", msg);
                        msg.MessageID = "0"; // Fallback ID for debugging
                    }

                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add('message');
                    messageDiv.innerHTML = `
                        <div class="sender">${msg.SenderName}</div>
                        <div class="timestamp">${msg.PostedTime}</div>
                        <span class="reply-btn" onclick="replyTo('${msg.SenderName}')">Reply</span>
                        <div class="text">${msg.MessageContent}</div>
                        ${msg.SenderName === currentUser && msg.MessageID !== "0" ? `<button class="delete-btn" onclick="deleteMessage(${msg.MessageID})">Delete</button>` : ''}
                    `;
                    messagesContainer.appendChild(messageDiv);
                });
            } catch (error) {
                console.error("Error loading forum data:", error);
                alert("Failed to load forum data.");
            }
        }

        // Function to reply to a message
        function replyTo(senderName) {
            const inputField = document.querySelector('.input-container input');
            const replyHighlight = document.querySelector('.reply-highlight');

            // Set the input field with @username
            inputField.value = `@${senderName} `;

            // Show the reply highlight above input
            replyHighlight.textContent = `Replying to @${senderName}`;
            replyHighlight.style.display = "inline-block";
        }

        // Function to delete a message
        async function deleteMessage(messageId) {
            if (!messageId || messageId === "0") {
                alert("Error: Message ID is missing.");
                return;
            }

            if (!confirm("Are you sure you want to delete this comment?")) return;

            try {
                const response = await fetch(`/api/forum/messages/${messageId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert("Message deleted successfully.");
                    loadForumData(); // Reload forum data
                } else {
                    alert("Failed to delete message.");
                }
            } catch (error) {
                console.error("Error deleting message:", error);
                alert("An error occurred while deleting the message.");
            }
        }

        // Function to post a new message
        async function postMessage() {
    const categoryId = getQueryParam('categoryId');
    const messageInput = document.querySelector('.input-container input');
    const messageContent = messageInput.value;

    if (!messageContent.trim()) {
        alert("Message cannot be empty!");
        return;
    }

    try {
        await fetch('/api/forum/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                categoryId: parseInt(categoryId),
                senderName: 'Ben Johnson',
                messageContent,
            }),
        });

        messageInput.value = ''; // Clear input field

        // ✅ Fix: Ensure `.reply-highlight` exists before modifying
        const replyHighlight = document.querySelector('.reply-highlight');
        if (replyHighlight) {
            replyHighlight.style.display = "none"; 
        }

        loadForumData(); // Reload messages
    } catch (error) {
        console.error("Error posting message:", error);
        alert("Failed to post message.");
    }
}


        // Initialize forum data on page load
        window.onload = loadForumData;
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../forum/ForumCategory.html" class="back-button">
                <img src="../images/back-icon.png" alt="Back">
            </a>
            <h1>Forum Title</h1>
        </div>
        <div class="messages"></div>
        <div class="input-container">
            <input type="text" placeholder="Type your input...">
            <button onclick="postMessage()">&#8593;</button>
        </div>
    </div>
</body>
</html>
