<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <!-- Bootstrap CSS -->
    <link href="../styles/bootstrap/bootstrap.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="../styles/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!--entire chatbot-->
    <div class="card chatbot">
        <!--chatbot header-->
        <div class="chatbot-header">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>OCBC Helper</span>
                <button class="btn btn-link chatbot-exit" type="button">
                    <a href="javascript:history.back()">
                        <i class="bi bi-x-lg text-light"></i>
                    </a>
                </button>
            </div>
        </div>

        <!--chatbot conversation area-->
        <div class="card-body chatbot-convo" id="conversationArea">
            <blockquote class="blockquote mb-0">
                <!-- Messages will be dynamically added here -->
            </blockquote>
        </div>
        
        <!--chatbot user action area-->
        <div class="input-group mb-3 chatbot-useraction">
            <textarea class="form-control" id="userInput" placeholder="Type your message..." aria-label="Type your message..." aria-describedby="basic-addon2" rows="1"></textarea>
            <div class="input-group-append">
                <button id="click_to_convert" class="btn btn-outline-light chatbot-useraction-mic" type="button">
                    <i class="bi bi-mic"></i>
                </button>
            </div>
            <div class="input-group-append">
                <button class="btn btn-outline-light chatbot-useraction-send" type="button" onclick="sendMessage()">
                    <i class="bi bi-send"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle (includes Popper) -->
    <script src="../scripts/bootstrap/bootstrap.bundle.js"></script>
    <!-- Custom Script for Creating Posts -->
    <script src="../scripts/chatbotscript.js"></script>
    <script src="../scripts/speechtotext.js"></script>
    <script>
        window.watsonAssistantChatOptions = {
          integrationID: "9ef3057f-a2cb-414e-9859-c70216dd3c85", // The ID of this integration.
          region: "us-south", // The region your integration is hosted in.
          serviceInstanceID: "dd762ac3-8156-4f36-89e0-74101a9dc428", // The ID of your service instance.
          onLoad: async (instance) => {
            await instance.render();
            instance.openWindow(); // Automatically opens the chat window
        }    
        };
        setTimeout(function(){
          const t=document.createElement('script');
          t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
          document.head.appendChild(t);
        });
      </script>
</body>

</html>
