<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <!-- Bootstrap CSS -->
    <link href="../styles/bootstrap/bootstrap.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="../styles/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body {
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center;     /* Center vertically */
            height: 100vh;           /* Full viewport height, adjust as needed */
        }

        .terminate{
            padding: 10%;
            text-align: center;      /* Center text inside the element */
            display: flex;
            flex-direction: column;  /* Stack items vertically */
            justify-content: center; /* Center horizontally */
            align-items: center;     /* Center vertically */
        }

        .button-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Space between the buttons */
            margin-top: 20px;
        }   

        .button {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFFFFF;
            color: #3d525d;
            border: none;
            padding: 10px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            flex-grow: 1;
            flex-shrink: 1;
            min-width: 100px; /* Set a minimum width for the buttons */
            border-radius: 25px;
            box-shadow: 0 4px 20px rgba(217, 197, 197, 0.4); /* Shadow for the pop-out effect */
        }

        .button:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="terminate" style="display: none;">
        <h2>Are you sure you want to terminate session?</h2>
        <div class="button-container">
            <button class="button" onclick="restartAndGoBack()">Terminate & Exit</button>
            <button class="button" onclick="saveAndGoBack()">Save & Exit</button>
            <button class="button" onclick="openChatBot()">Continue Chatting</button>
        </div>
    </div>
    <script src="../scripts/chatbot.js"></script>
</body>
</html>
