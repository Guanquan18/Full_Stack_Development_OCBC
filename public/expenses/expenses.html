<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../styles/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Open Sans', sans-serif;
        }
        a {
            text-decoration: none; /* Remove underline */
        }

        /* Additional states to prevent underlining */
        a:link,
        a:visited,
        a:hover,
        a:focus,
        a:active {
            text-decoration: none;
            color: #3f4347;
        }

        .expenses-wrapper{
            width: 85%;
            height: fit-content;
            margin: 0 auto;
        }
        /* Financial Overview Header */
        .financial-header {
            padding: 20px;
            text-align: center;
            margin: 20px auto;
        }
        .financial-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
            color: #e74d3c;
        }

        .acount-balance-container {
            width: 100%;
            height: fit-content;
            margin: 20px auto;
            text-align: center;
            color: white;
        }

        .account-balance-container h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: #626262;
        }

        .account-balance {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
        }

        .account-balance-month {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0;
            color: #626262;
        }


        /* Charts Section */
        .charts-section {
            width: 100%;
            margin: 20px auto;
            text-align: center;
            color: white;
        }

        .chart-placeholder {
            width: 100%;
            height: fit-content;
            padding: 20px 0;
            margin-bottom: 20px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            border: 1px solid #e74d3c;
            border-radius: 10px;
        }

        

    </style>
</head>
<body>
    <article class="expenses-wrapper">
        <!-- Financial Overview Header -->
        <header class="financial-header">
            <h1>Financial Overview</h1>
        </header>
    
        <!-- Account Details Card -->
        <div class="account-balance-container">
            <h3>Total Spending</h3>
            <p class="account-balance">$23,540.00</p>
            <p class="account-balance-month">May 2024</p>
        </div>
    
        <!-- Embedded Charts Section -->
        <div class="charts-section">

                <!-- Line Chart -->
            <div class="chart-placeholder">
                <canvas id="line-chart" width="400" height="400"></canvas>
            </div>

            <!-- Pie Chart -->
            <div class="chart-placeholder">
                <canvas id="pie-chart" style="width: 100%; height: auto;"></canvas>
            </div>

            
        </div>
    </article>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

    <script src="../scripts/script.js"></script>
    <script>
        
        // Fetch data and display Expenses
        document.addEventListener("DOMContentLoaded", displayExpenses);

    </script>
</body>
</html>
