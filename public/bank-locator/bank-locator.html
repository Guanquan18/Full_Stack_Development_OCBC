<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Service Locator</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Open Sans", sans-serif;
      background-color: white;
    }

    .header{
      padding: 1rem;
      background: rgb(241,233,244);
      background: linear-gradient(45deg, rgba(241,233,244,1) 0%, rgba(252,251,249,1) 100%);
    }

    .header h1 {
      color: black;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .back-button {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: #333;
        font-size: 24px;
        font-weight: 600;
        float: left;
        margin-top: 20px;
    }

    .back-button img {
        height: 30px;
        margin-right: 5px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
    }

    .filters {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 250px;
    }

    select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 1rem;
      background-color: white;
    }

    button {
      padding: 0.75rem 1.5rem;
      background-color: #f03c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-family: "Open Sans", sans-serif; /* Match the font family */
      font-weight: 700; /* Match the font weight */
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #d63232;
    }

    #map {
      flex: 1;
      border-radius: 8px;
      border: 1px solid #ddd;
      background-color: #f8f8f8;
    }

    @media (max-width: 480px) {
      .filters {
        flex-direction: column;
      }

      .filter-group {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="../homepage/homepage.html" class="back-button">
      <img src="../images/back-icon.png" alt="Back">
     </a>
    <h1>Service Locator</h1>
  </div>

  <div class="content">
    <div class="filters">
      <div class="filter-group">
        <select id="category">
          <option value="1">ATMs</option>
          <option value="2">Fastlanes</option>
          <option value="3">Passbook Update Machines</option>
          <option value="4">Cash Deposit Machines</option>
          <option value="5">Quick Cheque Deposit</option>
          <option value="6">Safe Deposit</option>
          <option value="7">Al-Amin Bank Branch</option>
          <option value="8">Bank Branch</option>
          <option value="9">Business Centre</option>
          <option value="10">Frank Store</option>
          <option value="11">Premier Centre</option>
          <option value="12">Sunday Branch</option>
          <option value="13">Trade Centre</option>
        </select>
      </div>
      <button onclick="fetchLocations()">Search</button>
    </div>

    <div id="map"></div>
  </div>

  <script>
    // Google Maps API key
    const googleMapsApiKey = "AIzaSyDxpqxJkl-MYKN_TQB52tDbQkd_bERM0VE";

    // OCBC API access token
    let ocbcAccessToken = "YOUR_ACCESS_TOKEN";

    let map;
    let markers = [];
    let userMarker; // Marker for user's location
    let userLocation; // User's current location
    let directionsService; // Google Maps Directions Service
    let directionsRenderer; // Google Maps Directions Renderer

    // Keep track of the currently open InfoWindow
    let currentInfoWindow = null;

    // Initialize the map
    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 1.3521, lng: 103.8198 }, // Default center: Singapore
        zoom: 12,
      });

      // Initialize Directions Service and Renderer
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer();
      directionsRenderer.setMap(map);

      // Fetch locations when the map loads
      fetchLocations();

      // Get user's location and center the map
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLocation = {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            };

            // Center the map on the user's location
            map.setCenter(userLocation);
            map.setZoom(15); // Zoom in closer

            // Add a marker for the user's location
            userMarker = new google.maps.Marker({
              position: userLocation,
              map: map,
              title: "Your Location",
              icon: {
                path: google.maps.SymbolPath.CIRCLE, // Custom icon for user location
                scale: 8, // Size of the icon
                fillColor: "#4285F4", // Blue color
                fillOpacity: 1,
                strokeWeight: 2,
                strokeColor: "#FFFFFF", // White border
              },
            });
          },
          (error) => {
            console.error("Error getting user location:", error);
          }
        );
      }
    }

    // Function to refresh the access token
    async function refreshAccessToken() {
      const response = await fetch("https://api.ocbc.com/oauth2/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams({
          client_id: "8FeY0VBsatSjwgPNP0zK7PIDwsYa",
          client_secret: "t2Vnz1xq_PBobZ08hiqSwpiYQFsa",
          grant_type: "client_credentials",
        }),
      });

      const data = await response.json();
      console.log("New Access Token:", data.access_token); // Debug
      return data.access_token;
    }

    /**
     * Simple helper to check if a location is (likely) open now.
     * Adjust this logic to match how your openingHours data is structured.
     */
    function isOpenNow(openingHours) {
      if (!openingHours) {
        return "unknown";
      }

      const hours = openingHours.toLowerCase();
      // Example checks
      if (hours.includes("24 hours") || hours.includes("24 hour")) {
        return "open";
      }
      if (hours.includes("closed")) {
        return "closed";
      }
      // Otherwise, unknown
      return "unknown";
    }

    // Fetch locations based on the selected category
    async function fetchLocations() {
      const category = document.getElementById("category").value;

      // Clear existing markers
      markers.forEach((marker) => marker.setMap(null));
      markers = [];

      try {
        let apiUrl;
        if (category <= 3) {
          // Fetch ATMs
          apiUrl = `https://api.ocbc.com/atm_locator/1.1?category=${category}&country=SG`;
        } else if (category <= 6) {
          // Fetch Deposit Machines or Branches
          apiUrl = `https://api.ocbc.com/locators/depositmachinesandsafeboxes/1.0?category=${
            category - 3
          }&country=SG`;
        } else {
          // Fetch Branches and Centres
          apiUrl = `https://api.ocbc.com/branch_locator/1.1?category=${category - 6}&country=SG`;
        }

        const response = await fetch(apiUrl, {
          headers: {
            Authorization: `Bearer ${ocbcAccessToken}`,
          },
        });

        if (response.status === 401) {
          // Token expired or invalid, refresh it
          ocbcAccessToken = await refreshAccessToken();
          // Retry the request with the new token
          return fetchLocations();
        }

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        console.log("API Response:", data); // Debug

        let locations;
        if (category <= 3) {
          locations = data.atmList; // ATMs
        } else if (category <= 6) {
          locations = data.depositList; // Deposit Machines or Branches
        } else {
          locations = data.branchesAndCentresList; // Branches and Centres
        }

        if (!locations || locations.length === 0) {
          return;
        }

        // Add markers for each location
        locations.forEach((location) => {
          const marker = new google.maps.Marker({
            position: {
              lat: parseFloat(location.latitude),
              lng: parseFloat(location.longitude),
            },
            map: map,
            title: location.address,
          });

          // Determine open/closed status (simple check)
          const status = isOpenNow(location.openingHours);
          let statusText = "";
          let statusColor = "#999"; // default unknown is gray

          if (status === "open") {
            statusText = "Open Now";
            statusColor = "green";
          } else if (status === "closed") {
            statusText = "Closed";
            statusColor = "red";
          } else {
            statusText = "Unknown";
          }

          // Build custom HTML for the info window
          const infoWindowContent = `
            <div style="font-family: 'Open Sans', sans-serif; max-width: 250px;">
              <h3 style="margin-top:0; margin-bottom: 0.5rem;">${location.category}</h3>
              <p style="margin: 0 0 0.5rem;">${location.address || ""}</p>
              <p style="margin: 0 0 0.5rem;">${location.landmark || ""}</p>
              <div
                style="
                  margin: 0.5rem 0;
                  padding: 0.5rem;
                  border-radius: 5px;
                  background-color: #f6f6f6;
                "
              >
                <strong>Opening Hours:</strong> ${location.openingHours || "Not Available"}
                <div style="margin-top: 0.5rem;">
                  Status: <span style="color: ${statusColor}; font-weight: 700;">${statusText}</span>
                </div>
              </div>
              <button
                onclick="showPathToLocation(${location.latitude}, ${location.longitude})"
                style="
                  padding: 0.5rem 1rem;
                  font-size: 0.9rem;
                  font-weight: 700;
                  color: white;
                  background-color: #f03c3c;
                  border: none;
                  border-radius: 15px;
                  cursor: pointer;
                  box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
                  transition: background-color 0.3s ease;
                  margin-top: 0.5rem;
                "
              >
                Show Path
              </button>
            </div>
          `;

          const infoWindow = new google.maps.InfoWindow({
            content: infoWindowContent,
          });

          // When marker is clicked:
          marker.addListener("click", () => {
            // 1. Close any currently open InfoWindow
            if (currentInfoWindow) {
              currentInfoWindow.close();
            }
            // 2. Pan/center the map to this marker
            map.panTo(marker.getPosition());

            // 3. Open the new InfoWindow
            infoWindow.open(map, marker);

            // 4. Track this InfoWindow as the currently open one
            currentInfoWindow = infoWindow;
          });

          markers.push(marker);
        });
      } catch (error) {
        console.error("Error fetching location data:", error);
      }
    }

    // Function to show the path to the selected location
    function showPathToLocation(locationLat, locationLng) {
      if (!userLocation) {
        alert("Please allow access to your location to show the path.");
        return;
      }

      const destination = {
        lat: parseFloat(locationLat),
        lng: parseFloat(locationLng),
      };

      // Request directions from the user's location to the selected location
      directionsService.route(
        {
          origin: userLocation,
          destination: destination,
          travelMode: google.maps.TravelMode.WALKING, // Could change to DRIVING/TRANSIT
        },
        (response, status) => {
          if (status === google.maps.DirectionsStatus.OK) {
            // Display the route on the map
            directionsRenderer.setDirections(response);
          } else {
            console.error("Error fetching directions:", status);
            alert("Could not calculate the path. Please try again.");
          }
        }
      );
    }
  </script>

  <!-- Load Google Maps JavaScript API -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxpqxJkl-MYKN_TQB52tDbQkd_bERM0VE&callback=initMap"
    async
    defer
  ></script>
</body>
</html>
