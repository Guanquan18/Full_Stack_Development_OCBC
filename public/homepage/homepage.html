    <!-- Bootstrap CSS -->

    <style>
        body {
            margin: 0;
            font-family: 'Open Sans', sans-serif;
            background: white;
            color: #3f4347;
        }
        a {
            text-decoration: none; /* Remove underline */
        }

        /* Additional states to prevent underlining */
        a:link,
        a:visited,
        a:hover,
        a:focus,
        a:active {
            text-decoration: none;
            color: #3f4347;
        }
       /* Header */
       .homepage-header {
            padding: 15px 20px 10px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .greeting {
            padding: 15px 20px;
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.4;
        }
        /* Angled Strips */
        .angled-strips {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .strip {
            width: 140px;
            height: 35px; 
            background-color: #ED3F3F; 
            position: absolute;
            border-radius: 20px;
            transform: rotate(45deg);
        }

        .strip:nth-child(1) {
            left: -50px; 
            top: 0px;
        }

        .strip:nth-child(2) {
            width: 60px;
            left: 30px; 
            top: -15px;
        }

        .strip:nth-child(3) {
            width:60px;
            left: -30px;
            top: 35px;
        }

        /* Icons Section */
        .header-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            transition: transform 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }

        .header-icon:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }

        .hamburger-icon {
            font-size: 26px;
            cursor: pointer;
            margin-left: 15px;
            transition: color 0.2s ease-in-out;
        }

        .hamburger-icon:hover {
            color: #00C3FF;
        }

        /* Bank Card Styles */
        .bank-card {
            background: linear-gradient(45deg, rgba(254,234,227,1) 0%, rgba(242,240,243,1) 39%, rgba(242,240,243,1) 57%, rgba(250,250,252,1) 100%);
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            width: 400px;
            height: auto;
            margin: 0px auto 20px auto;
            padding-bottom: 15px;
        }

        /* Savings Account (Red Card) */
        .account {
            background: #ED3F3F;
            padding: 20px;
            border-radius: 15px;
            color: white;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }

        .ocbc-logo {
            width: 141px;
            position: absolute;
            top: 15px;
            left: 18px;
        }

        .account-title {
            font-size: 20px;
            font-weight: 700;
            margin-top: 30px;
        }

        /* Balance Section Styling */
        .card-balance,.card-details,.account-number-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .balance-title,.amount-value, .card-number-title, .card-number,.account-number-title,.account-number{
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            margin: 0;
        }

        /* Icon */
        .icon-section {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-item img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        .icon-item h2 {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin: 0;
        }
        
        /* Feature */
        .feature {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            background: #FFFFFF;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            height: 180px;
        }

        .feature-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
        }
        .feature-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            text-align: center;
            color: #3f4347;
        }

        /* Menu PopUp */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; 
            z-index: 1000;
        }

        .popup-content {
            background: #fbfaf8;
            padding: 30px;
            width: 100%;
        }

        .close-btn {
            float: right;
            font-size: 30px;
            cursor: pointer;
        }

        /* Menu Popup */
        .homepage-menu-flex-container {
            display: flex;
            flex-direction: column; 
            align-items: left;
        }

        .homepage-menu-flex-item {
            display: flex;
            align-items: left;
            margin-bottom: 20px; 
            padding: 10px;
            color: #3f4347;
            transition: color 0.2s ease-in-out;
        }
        .homepage-menu-flex-item:hover {
            color: blue;
        }

        .homepage-menu-flex-item img {
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }

        .homepage-menu-flex-item h2 {
            font-size: 20px;
            font-weight: 700;
            text-align: left;
            padding-top: 4px;
            margin: 0;
        }
        
        /* Hamburger icon rotation to open */
        .rotate-hamburger {
            transform: rotate(180deg);
            transition: transform 0.5s ease-in-out;
        }

        /* Cross icon rotation when closing */
        .rotate-cross {
            transform: rotate(-180deg);
            transition: transform 0.5s ease-in-out;
        }

        /* Style for intro js*/
        .introjs-tooltip {
            background-color: #282c34; 
            color: #fff;              
            border-radius: 8px;        
            padding: 10px;             
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease-in-out;
        }

        .introjs-skipbutton {
            font-size: 30px;
            color: white;
        }

        .introjs-tooltiptext {
            font-size: 20px;          
            line-height: 1.6;
            padding: 0px 20px;
        }
        .introjs-tooltipbuttons{
            border-top: 0px solid #e0e0e0;
            padding: 0px;
        }
        .introjs-tooltipbuttons a {
            background-color: #ED3F3F !important;
            box-shadow: none;
            color: #fff !important;          
            padding: 10px 15px;
            border-radius: 5px;
            margin: 5px;
            border: none !important;
            text-shadow: none;
            font-size:15px;
            font-weight:700;
        }
        
        .introjs-tooltip-title {
            font-weight: bold;     
            margin-bottom: 10px;
            color: white;
            font-style: italic;
            text-decoration: underline;
        }

        .introjs-progress {
            display: block !important; 
            height: 4px;
            background-color: #fff; 
        }

        .introjs-progressbar {
            background-color: #ED3F3F; 
        }
        .introjs-arrow.top-middle,.introjs-arrow.top-right,.introjs-arrow.top-left {
            color:black;
            border-bottom-color: black;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .introjs-tooltip iframe {
            width: 100%;
            height: auto;
            padding: 0px !important;
        }
        .tts-button {
            background-color: #ED3F3F; 
            color: white;         
            border: none;         
            border-radius: 8px;   
            padding: 10px 15px;   
            font-size: 16px;
            font-weight: 600;
            margin-top: 5px;

        .tts-button:hover {
            background-color: darkred; 
        }
        .tts-button img {
            width: 20px;               
            height: 20px;
            margin-right: 10px !important;
        }
        .unstyled-link{
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

    <script>
        // Function to retrieve profile,account details, card details
        async function fetchAllDetails() {
            await fetchProfileDetails(); 
            await fetchAccountDetails();     
            await fetchCardDetails();       
        }
        fetchAllDetails();
        // Function to handle opening the popup
        function openMenuPopup() {
            const hamburgerIcon = document.querySelector('.hamburger-icon');
            hamburgerIcon.classList.add('rotate-hamburger');
            setTimeout(() => {
                document.getElementById('menu-popup').style.display = 'flex';
                hamburgerIcon.classList.remove('rotate-hamburger');
            }, 500);
        }
    
        // Function to handle closing the popup
        function closeMenuPopup() {
            const crossIcon = document.querySelector('.homepage-close-btn');
            crossIcon.classList.add('rotate-cross');
            setTimeout(() => {
                document.getElementById('menu-popup').style.display = 'none';
                crossIcon.classList.remove('rotate-cross'); // Remove the rotation after hiding
            }, 500);
        }

        document.getElementById('videoCall').onclick = async function() {
            try {
                const response = await fetch('/video-calling/create-room', {
                    method: 'POST'
                });
                const data = await response.json();
                console.log('room data: ', data);

                window.open(data.roomUrl, '_blank');    // Open the video call page in a new tab
                
                if (response.ok) {
                    try{
                        await fetch('/video-calling/send-host-url', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                data: data
                            })
                        });
                    }catch(error){
                        console.log('Error:', error);
                    }
                } else {
                    console.log(data.message);
                    alert('Failed to create video calling room. Try again later.');
                }
            } catch (error) {
                console.log('Error:', error);
            }
        }
